<footer class="site-footer">
  <nav class="social-links" aria-label="Find me elsewhere">
    {% for item in site.data.settings.social %}
      {% assign label = item.title | default: item.icon | capitalize %}
      {% if item.link contains 'mailto:' %}{% assign label = 'Email' %}{% endif %}
      {% if item.title %}{% assign label = item.title %}{% endif %}
      <a href="{{ item.link | escape }}">{{ label | escape }}</a>
    {% endfor %}
  </nav>
</footer>
